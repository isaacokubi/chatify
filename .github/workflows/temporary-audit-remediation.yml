name: Temporary dependency audit remediation

on:
  push:
    branches:
      - fix/e2ee-new-device-key-transfer-2026-11-11
    paths:
      - .github/workflows/temporary-audit-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/e2ee-new-device-key-transfer-2026-11-11
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Apply non-breaking security updates
        working-directory: server
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=high
      - name: Commit lockfile updates and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git rm .github/workflows/temporary-audit-remediation.yml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 1
          fi
          git commit -m "fix(deps): apply non-breaking security updates"
          git push origin HEAD:fix/e2ee-new-device-key-transfer-2026-11-11
