name: Build Chatify Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: chatify-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: mobile/pubspec.lock

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build installable APK
        run: >-
          flutter build apk --debug
          --dart-define=CHATIFY_API=https://chatify-api-c1eh.onrender.com

      - name: Run Flutter analyzer
        continue-on-error: true
        run: flutter analyze

      - name: Run Flutter tests
        continue-on-error: true
        run: flutter test

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatify-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
