name: Build Chatify Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: chatify-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: mobile/pubspec.lock

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      # Set repository variable CHATIFY_RELEASE_SIGNING_ENABLED=true and configure
      # the four release secrets below to produce shareable, signed release APKs.
      - name: Prepare release signing key
        if: ${{ vars.CHATIFY_RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.CHATIFY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing is enabled but CHATIFY_ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chatify-release.jks"
          echo "CHATIFY_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/chatify-release.jks" >> "$GITHUB_ENV"

      - name: Build optimized signed release APKs
        if: ${{ vars.CHATIFY_RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          CHATIFY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CHATIFY_ANDROID_KEYSTORE_PASSWORD }}
          CHATIFY_ANDROID_KEY_ALIAS: ${{ secrets.CHATIFY_ANDROID_KEY_ALIAS }}
          CHATIFY_ANDROID_KEY_PASSWORD: ${{ secrets.CHATIFY_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$CHATIFY_ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing CHATIFY_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$CHATIFY_ANDROID_KEY_ALIAS" || { echo "::error::Missing CHATIFY_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$CHATIFY_ANDROID_KEY_PASSWORD" || { echo "::error::Missing CHATIFY_ANDROID_KEY_PASSWORD"; exit 1; }
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --dart-define=CHATIFY_API=https://chatify-api-c1eh.onrender.com

      # A debug APK is provided only as a fallback for installation testing.
      # It is not a production release and should not be distributed to end users.
      - name: Build ARM64 debug APK for installation testing
        if: ${{ vars.CHATIFY_RELEASE_SIGNING_ENABLED != 'true' }}
        run: |
          echo "::warning::Release signing is not configured. This artifact is for testing only, not production distribution."
          flutter build apk --debug --target-platform android-arm64 --dart-define=CHATIFY_API=https://chatify-api-c1eh.onrender.com

      - name: Upload signed release APKs
        if: ${{ vars.CHATIFY_RELEASE_SIGNING_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chatify-android-release-apks
          path: |
            mobile/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release symbol files
        if: ${{ vars.CHATIFY_RELEASE_SIGNING_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chatify-android-release-symbols
          path: mobile/build/symbols/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload ARM64 debug APK for testing
        if: ${{ vars.CHATIFY_RELEASE_SIGNING_ENABLED != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chatify-android-arm64-debug-test-only
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
