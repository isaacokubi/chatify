name: Chatify CI
on:
  push:
  pull_request:

# Keep only the newest CI run per branch; feature work may be committed in several small steps.
concurrency:
  group: chatify-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the committed lockfile so CI validates the exact dependency graph.
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Validate backup and recovery shell scripts
        run: bash -n scripts/backup-mongodb.sh scripts/restore-mongodb.sh
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --dart-define=CHATIFY_API=https://chatify-api-c1eh.onrender.com
      - run: flutter create --platforms=android --project-name chatify .
      # Current Flutter Android plugins require compileSdk 36; install it explicitly in this generated CI project.
      - name: Install Android SDK 36 and configure compileSdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          sed -i -E 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          grep -n 'compileSdk' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
      # file_picker 8.x declares compileSdk 34; its Android lifecycle dependency now requires 36.
      # Align that plugin module too (the app's compileSdk alone does not change plugin metadata).
      - name: Align file_picker plugin with Android SDK 36
        run: |
          # Resolve the package from Flutter's generated plugin manifest instead of assuming a cache path.
          FILE_PICKER_DIR=$(python3 -c 'import json; d=json.load(open(".flutter-plugins-dependencies")); print(next((p["path"] for p in d["plugins"]["android"] if p["name"] == "file_picker"), ""))')
          test -n "$FILE_PICKER_DIR"
          FILE_PICKER_GRADLE=$(find "$FILE_PICKER_DIR/android" -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit)
          test -n "$FILE_PICKER_GRADLE"
          sed -i -E 's/^[[:space:]]*compileSdkVersion.*/    compileSdkVersion 36/; s/^[[:space:]]*compileSdk[[:space:]]*=.*/    compileSdk = 36/; s/^[[:space:]]*compileSdk[[:space:]]+[0-9]+.*/    compileSdk 36/' "$FILE_PICKER_GRADLE"
          grep -n 'compileSdk' "$FILE_PICKER_GRADLE"
          grep -Eq 'compileSdkVersion 36|compileSdk = 36|compileSdk 36' "$FILE_PICKER_GRADLE"
      - run: flutter build apk --debug
