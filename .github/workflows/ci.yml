name: Chatify CI
on:
  push:
  pull_request:

# Keep only the newest CI run per branch; feature work may be committed in several small steps.
concurrency:
  group: chatify-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the committed lockfile so CI validates the exact dependency graph.
      - run: npm ci
      # Fail CI on known high/critical advisories before releasing dependency changes.
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - name: Validate backup and recovery shell scripts
        run: bash -n scripts/backup-mongodb.sh scripts/restore-mongodb.sh

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --dart-define=CHATIFY_API=https://chatify-api-c1eh.onrender.com
      # Verify the Android Gradle files committed to this repository. Do not run
      # "flutter create" here: regenerating android/ would hide broken project config.
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Flutter SDK path for committed Android project
        run: |
          test -n "$FLUTTER_ROOT"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - name: Build Android debug APK using committed Gradle configuration
        run: flutter build apk --debug --dart-define=CHATIFY_API=https://chatify-api-c1eh.onrender.com
