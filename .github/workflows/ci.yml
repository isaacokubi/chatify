name: Chatify CI
on:
  push:
  pull_request:

# Keep only the newest CI run per branch; feature work may be committed in several small steps.
concurrency:
  group: chatify-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the committed lockfile so CI validates the exact dependency graph.
      - run: npm ci
      - run: npm test
      - run: npm run lint
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter create --platforms=android --project-name chatify .
      # Current Flutter Android plugins require compileSdk 36; install it explicitly in this generated CI project.
      - name: Install Android SDK 36 and configure compileSdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          sed -i -E 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          grep -n 'compileSdk' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
      - run: flutter build apk --debug
