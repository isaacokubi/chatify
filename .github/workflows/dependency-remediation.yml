name: Remediate backend dependency advisories

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/dependency-remediation.yml'

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  safe-npm-audit-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install locked dependencies
        working-directory: server
        run: npm ci

      - name: Apply non-breaking advisory fixes
        working-directory: server
        run: |
          npm audit fix || true
          npm audit --audit-level=high

      - name: Verify backend tests and syntax
        working-directory: server
        run: |
          npm test
          npm run lint
          npm audit --audit-level=high

      - name: Commit only validated dependency lock changes
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- server/package.json server/package-lock.json; then
            echo "No dependency manifest or lockfile changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json
          git commit -m "fix: remediate high-severity backend dependencies"
          git push origin "HEAD:${PR_HEAD_REF}"
