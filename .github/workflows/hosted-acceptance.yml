name: Chatify hosted API reachability

on:
  push:
    branches: [audit/hosted-acceptance-runner]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatify-hosted-api-reachability
  cancel-in-progress: false

jobs:
  hosted-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed API health endpoint
        run: |
          set -euo pipefail
          echo "Checking hosted API health endpoint; this does not authenticate or initiate payments."
          curl --fail --show-error --silent --max-time 30 https://chatify-api-c1eh.onrender.com/api/health -o /tmp/health.json
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); console.log(JSON.stringify({http:"200",status:d.status ?? null,ok:d.ok ?? null,service:d.service ?? null,db:d.db ?? d.database ?? null}));'
